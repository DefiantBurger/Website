# Shared toolchain setup for test.yaml and deploy.yaml, so action pins live in one place.
# Callers check out the repo first; a local action can't load before checkout.
name: Setup toolchains
description: Install uv (backend) and/or pnpm + Node (frontend).

inputs:
  python:
    description: Install uv. The Python version comes from backend/.python-version.
    default: 'false'
  node:
    description: Install pnpm and Node with the pnpm store cached. The pnpm version comes from packageManager in frontend/package.json.
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        working-directory: backend
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: frontend/package.json
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
