[project]
name = "backend"
version = "0.1.0"
description = "Flask API backend for josephcicalese.com"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "flask-cors>=6.0.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
# Never built or installed: deploys use `uv export --no-emit-project`, and main.py runs from this directory.
package = false
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
extend-exclude = ["instance"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "single"

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting, pyupgrade and bugbear. Not W: W191 flags tab indentation.
extend-select = ["I", "UP", "B"]
