// Appends to Debian's 50unattended-upgrades (security only), adding point releases and cloudflared.
// Reboots only when a package needs one (e.g. libc); the VM clock is UTC.
// Kernels come only from the pinned boot image: an auto-installed kernel once crashed the VM on every boot.
Unattended-Upgrade::Origins-Pattern {
	"origin=Debian,codename=${distro_codename},label=Debian";
	"site=pkg.cloudflare.com";
};
Unattended-Upgrade::Package-Blacklist {
	"linux-image-";
};
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "09:17";
