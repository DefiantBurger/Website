<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
  <!-- Source for every site icon; run ./gen-icons.sh after editing. Shape: Material Symbols Outlined "developer_board" (Apache 2.0). -->
  <defs>
    <!-- Inner glow: blur the inverted shape and keep what bleeds back inside the edges -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="15" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in" result="edge" />
      <feFlood flood-color="#4446ff" />
      <feComposite in2="edge" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" result="body" />
      <!-- Faint outer glow in the fill color -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" />
      <feComponentTransfer result="haloMask">
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feFlood flood-color="#abaeff" />
      <feComposite in2="haloMask" operator="in" result="halo" />
      <feComposite in="body" in2="halo" operator="over" />
    </filter>
  </defs>
  <path
    fill="#abaeff"
    filter="url(#glow)"
    d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h560q33 0 56.5 23.5T800-760v80h80v80h-80v80h80v80h-80v80h80v80h-80v80q0 33-23.5 56.5T720-120H160Zm0-80h560v-560H160v560Zm80-80h200v-160H240v160Zm240-280h160v-120H480v120Zm-240 80h200v-200H240v200Zm240 200h160v-240H480v240ZM160-760v560-560Z"
  />
</svg>
