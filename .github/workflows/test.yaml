# Tests every PR and push to main.
# Pushes that only change docs skip it.
name: Test

on:
  push:
    branches: [ main ]
    # Neither affects the tests. Project write-ups live in frontend/src/content,
    # so they're still built and tested.
    paths-ignore:
      - 'documentation/**'
      - '**/README.md'
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: true
      - run: uv sync --frozen
      # Lint and format warn instead of failing so they don't block the tests.
      - run: uv run ruff check . || echo '::warning::Ruff found lint problems (see this step log)'
      - run: uv run ruff format --check . || echo '::warning::Backend files need formatting (run ./format.sh)'
      - run: uv run pytest --cov=app --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: true
      - run: pnpm install --frozen-lockfile
      # Lint and format warn instead of failing so they don't block the tests.
      - run: pnpm lint || echo '::warning::ESLint found lint problems (see this step log)'
      - run: pnpm format:check || echo '::warning::Frontend files need formatting (run ./format.sh)'
      - run: pnpm check
      - run: pnpm test
