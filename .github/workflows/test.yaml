# Tests every PR and push to main. deploy.yaml also calls it before shipping.
# Pushes that only change docs skip it.
name: Test

on:
  push:
    branches: [ main ]
    # Neither affects the tests. Project write-ups live in frontend/src/content,
    # so they're still built and tested.
    paths-ignore:
      - 'documentation/**'
      - '**/README.md'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version comes from backend/.python-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
      - run: uv sync --frozen
      # Lint and format warn instead of failing so they don't block tests or deploys.
      - run: uv run ruff check . || echo '::warning::Ruff found lint problems (see this step log)'
      - run: uv run ruff format --check . || echo '::warning::Backend files need formatting (run ./format.sh)'
      - run: uv run pytest --cov=app --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from packageManager in frontend/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Lint and format warn instead of failing so they don't block tests or deploys.
      - run: pnpm lint || echo '::warning::ESLint found lint problems (see this step log)'
      - run: pnpm format:check || echo '::warning::Frontend files need formatting (run ./format.sh)'
      - run: pnpm check
      - run: pnpm test
