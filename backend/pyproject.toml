[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Flask API backend for josephcicalese.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "cryptography>=42.0.0",
    "python-dotenv>=1.2.2",
    "waitress>=3.0.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["instance*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
extend-exclude = ["instance"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "single"

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting, pyupgrade and bugbear. Not W: W191 flags tab indentation.
extend-select = ["I", "UP", "B"]
